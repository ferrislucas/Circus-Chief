<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" font-family="monospace">
  <rect x="0" y="0" width="520" height="560" rx="8" fill="#111827"/>
  <rect x="10" y="10" width="500" height="540" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="30" y="48" fill="#f3f4f6" font-size="17" font-weight="bold">Built-in Provider Settings</text>
  <text x="470" y="48" fill="#9ca3af" font-size="17">x</text>
  <line x1="10" y1="64" x2="510" y2="64" stroke="#374151"/>

  <text x="30" y="92" fill="#9ca3af" font-size="12">Commit attribution override</text>
  <rect x="30" y="100" width="460" height="30" rx="4" fill="#111827" stroke="#374151"/>
  <text x="40" y="120" fill="#6b7280" font-size="12">Blank uses agent default</text>

  <text x="30" y="160" fill="#9ca3af" font-size="12">Models</text>
  <rect x="30" y="168" width="460" height="30" rx="4" fill="#111827" stroke="#374151"/>
  <text x="40" y="188" fill="#e5e7eb" font-size="12">muse-spark-1.3  ·  Muse Spark 1.3</text>
  <text x="440" y="188" fill="#34d399" font-size="12">On</text>
  <rect x="30" y="202" width="460" height="30" rx="4" fill="#111827" stroke="#374151"/>
  <text x="40" y="222" fill="#e5e7eb" font-size="12">muse-spark-1.3-contributor</text>
  <text x="440" y="222" fill="#34d399" font-size="12">On</text>

  <rect x="24" y="248" width="472" height="170" rx="6" fill="none" stroke="#22d3ee" stroke-dasharray="6 4"/>
  <text x="30" y="272" fill="#22d3ee" font-size="13" font-weight="bold">Usage probe model  (meta only — NEW)</text>
  <circle cx="42" cy="296" r="7" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="42" cy="296" r="3" fill="#22d3ee"/>
  <text x="58" y="300" fill="#f3f4f6" font-size="12">Muse Spark 1.3  ·  muse-spark-1.3 [default]</text>
  <circle cx="42" cy="322" r="7" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="58" y="326" fill="#e5e7eb" font-size="12">Muse Spark 1.3 Contributor</text>
  <text x="58" y="344" fill="#6b7280" font-size="11">muse-spark-1.3-contributor</text>
  <text x="30" y="372" fill="#9ca3af" font-size="11">Note: each probe runs one micro-turn on this</text>
  <text x="30" y="388" fill="#9ca3af" font-size="11">model to refresh the usage indicator.</text>

  <line x1="10" y1="440" x2="510" y2="440" stroke="#374151"/>
  <rect x="330" y="458" width="80" height="32" rx="4" fill="#374151"/>
  <text x="348" y="479" fill="#e5e7eb" font-size="13">Cancel</text>
  <rect x="418" y="458" width="72" height="32" rx="4" fill="#0891b2"/>
  <text x="438" y="479" fill="#ffffff" font-size="13">Save</text>

  <text x="30" y="528" fill="#6b7280" font-size="11">Entry: Providers view → Meta (Official) card →</text>
  <text x="30" y="544" fill="#6b7280" font-size="11">Settings. Dashed = new section, meta kind only.</text>
</svg>
